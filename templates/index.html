<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoliaBox | Çok Yakında</title>
    <meta name="google-adsense-account" content="ca-pub-9804139900544479">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --neon: #00f3ff;
            --neon-secondary: #bc00ff;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space+Grotesk', 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract Neon Shapes */
        .neon-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: var(--neon);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        .neon-circle:nth-child(2) {
            background: var(--neon-secondary);
            width: 350px;
            height: 350px;
            animation-delay: -10s;
        }

        @keyframes move {
            from { transform: translate(-30%, -30%); }
            to { transform: translate(30%, 30%); }
        }

        .content {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            line-height: 1;
            animation: flicker 4s infinite alternate;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon), 0 0 30px var(--neon);
            }
            20%, 24%, 55% { text-shadow: none; }
        }

        .subtext {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 4rem;
        }

        .line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            margin: 20px auto;
        }

        .status {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--neon);
            text-transform: uppercase;
        }

        /* Scanline Effect */
        body::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="neon-circle"></div>
    <div class="neon-circle"></div>
    
    <div class="content">
        <p class="status">Sistem Başlatılıyor...</p>
        <div class="line"></div>
        <h1>Çok Yakında...</h1>
        <p class="subtext">Yeni Bir Deneyim Başlıyor</p>
        <div class="line"></div>
    </div>
</body>
</html>
