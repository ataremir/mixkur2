<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoliaBox | Çok Yakında</title>
    <meta name="description" content="AnatoliaBox — Yeni bir deneyim çok yakında sizlerle.">
    <meta name="google-adsense-account" content="ca-pub-9804139900544479">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { outfit: ['Outfit', 'sans-serif'] },
                    colors: {
                        neon: { cyan: '#00f3ff', magenta: '#ff00ea', purple: '#bc00ff' },
                        dark: { 900: '#050508', 800: '#0a0a12', 700: '#10101c', 600: '#1a1a2e' },
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                        'scan': 'scan 8s linear infinite',
                        'spin-slow': 'spin 20s linear infinite',
                        'fadeInUp': 'fadeInUp 1s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 20px rgba(0,243,255,0.3), 0 0 60px rgba(0,243,255,0.1)' },
                            '100%': { boxShadow: '0 0 40px rgba(0,243,255,0.6), 0 0 100px rgba(0,243,255,0.2)' },
                        },
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100vh)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        /* Scanline overlay efekti */
        .scanline-overlay::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 243, 255, 0.015) 2px,
                rgba(0, 243, 255, 0.015) 4px
            );
            pointer-events: none;
            z-index: 50;
        }

        /* Neon text glow */
        .neon-text {
            text-shadow:
                0 0 7px rgba(0, 243, 255, 0.7),
                0 0 20px rgba(0, 243, 255, 0.5),
                0 0 42px rgba(0, 243, 255, 0.3),
                0 0 82px rgba(0, 243, 255, 0.15);
        }

        .neon-text-magenta {
            text-shadow:
                0 0 7px rgba(255, 0, 234, 0.7),
                0 0 20px rgba(255, 0, 234, 0.5),
                0 0 42px rgba(255, 0, 234, 0.3);
        }

        /* Neon border glow */
        .neon-border {
            box-shadow:
                0 0 10px rgba(0, 243, 255, 0.2),
                inset 0 0 10px rgba(0, 243, 255, 0.05);
        }

        /* Glitch efekti */
        @keyframes glitch1 {
            0%, 100% { clip-path: inset(40% 0 61% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(92% 0 1% 0); transform: translate(1px, -1px); }
            40% { clip-path: inset(43% 0 1% 0); transform: translate(-1px, 3px); }
            60% { clip-path: inset(25% 0 58% 0); transform: translate(3px, 1px); }
            80% { clip-path: inset(54% 0 7% 0); transform: translate(-3px, -2px); }
        }
        @keyframes glitch2 {
            0%, 100% { clip-path: inset(15% 0 67% 0); transform: translate(2px, -1px); }
            20% { clip-path: inset(60% 0 8% 0); transform: translate(-1px, 2px); }
            40% { clip-path: inset(5% 0 80% 0); transform: translate(1px, -3px); }
            60% { clip-path: inset(70% 0 12% 0); transform: translate(-2px, 1px); }
            80% { clip-path: inset(30% 0 45% 0); transform: translate(3px, -1px); }
        }

        .glitch-wrapper { position: relative; }
        .glitch-wrapper .glitch-copy {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            opacity: 0.8;
        }
        .glitch-wrapper .glitch-copy:first-of-type {
            color: #ff00ea;
            animation: glitch1 3s infinite linear;
        }
        .glitch-wrapper .glitch-copy:last-of-type {
            color: #00f3ff;
            animation: glitch2 3s infinite linear;
        }

        /* Ad slot styling */
        .ad-slot {
            border: 1px dashed rgba(0, 243, 255, 0.15);
            background: linear-gradient(180deg, rgba(0,243,255,0.02) 0%, transparent 50%, rgba(188,0,255,0.02) 100%);
            min-height: 600px;
        }

        /* Ata ikonu SVG neon efekti */
        .horse-icon {
            filter: drop-shadow(0 0 12px rgba(0,243,255,0.6))
                    drop-shadow(0 0 30px rgba(0,243,255,0.3))
                    drop-shadow(0 0 60px rgba(188,0,255,0.2));
        }

        /* Particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 243, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-outfit bg-dark-900 text-white min-h-screen overflow-x-hidden scanline-overlay">

    <!-- ═══════════ ARKA PLAN EFEKTLERİ ═══════════ -->
    <!-- Gradient Orbs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-neon-cyan/10 rounded-full blur-[150px] animate-float"></div>
        <div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-neon-purple/10 rounded-full blur-[120px] animate-float-delayed"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-neon-magenta/5 rounded-full blur-[100px] animate-pulse-slow"></div>
    </div>

    <!-- Grid pattern -->
    <div class="fixed inset-0 pointer-events-none z-0 opacity-[0.03]"
         style="background-image: linear-gradient(rgba(0,243,255,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,243,255,0.3) 1px, transparent 1px);
                background-size: 60px 60px;">
    </div>

    <!-- Scanning line -->
    <div class="fixed left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-neon-cyan/40 to-transparent animate-scan pointer-events-none z-40"></div>

    <!-- ═══════════ ANA YAPI: 3 SÜTUN ═══════════ -->
    <div class="relative z-10 min-h-screen flex flex-col">

        <!-- Desktop: 3-column grid / Mobile: single column -->
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-[200px_1fr_200px] xl:grid-cols-[250px_1fr_250px] gap-0">

            <!-- ═══════ SOL SÜTUN: Banner Reklam Alanı ═══════ -->
            <aside class="hidden lg:flex flex-col items-center justify-center p-4">
                <div class="ad-slot w-full rounded-2xl flex flex-col items-center justify-center text-center p-4 sticky top-8">
                    <div class="space-y-3 opacity-30">
                        <svg class="w-8 h-8 mx-auto text-neon-cyan/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <p class="text-[10px] tracking-[3px] uppercase text-neon-cyan/30">Reklam Alanı</p>
                    </div>
                </div>
            </aside>

            <!-- ═══════ ORTA SÜTUN: İÇERİK ═══════ -->
            <main class="flex flex-col items-center justify-center px-6 py-16 min-h-screen">

                <!-- Status pill -->
                <div class="animate-fadeInUp" style="animation-delay: 0.2s; opacity: 0;">
                    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-neon-cyan/20 bg-dark-700/50 backdrop-blur-md mb-10">
                        <span class="w-2 h-2 bg-neon-cyan rounded-full animate-pulse"></span>
                        <span class="text-xs tracking-[4px] uppercase text-neon-cyan/80">Sistem Başlatılıyor</span>
                    </div>
                </div>

                <!-- Neon çizgi -->
                <div class="animate-fadeInUp" style="animation-delay: 0.4s; opacity: 0;">
                    <div class="w-24 h-[1px] bg-gradient-to-r from-transparent via-neon-cyan to-transparent mb-10"></div>
                </div>

                <!-- ═══════ ATA İKONU (NEON HORSE LOGO) ═══════ -->
                <div class="animate-fadeInUp" style="animation-delay: 0.6s; opacity: 0;">
                    <div class="relative animate-float mb-10">
                        <!-- Outer glow ring -->
                        <div class="absolute inset-0 w-36 h-36 md:w-44 md:h-44 rounded-full border border-neon-cyan/20 animate-glow"></div>
                        <div class="absolute inset-2 w-32 h-32 md:w-40 md:h-40 rounded-full border border-neon-purple/10"></div>

                        <!-- Horse SVG -->
                        <div class="w-36 h-36 md:w-44 md:h-44 rounded-full flex items-center justify-center bg-dark-800/60 backdrop-blur-xl border border-neon-cyan/30 relative overflow-hidden">
                            <!-- Inner gradient glow -->
                            <div class="absolute inset-0 bg-gradient-to-br from-neon-cyan/10 via-transparent to-neon-purple/10"></div>

                            <svg class="horse-icon w-20 h-20 md:w-24 md:h-24 text-neon-cyan relative z-10" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- Stylized at (horse) silhouette -->
                                <path d="M75 20C73 18 68 15 65 16C62 17 60 20 58 22C56 24 54 26 52 27C49 28 46 27 44 28C42 29 41 31 40 33C39 35 38 37 36 38C34 39 32 38 30 39C28 40 27 42 26 44C25 47 25 50 26 53C27 56 29 58 30 61C31 63 31 65 31 68C31 70 31 73 32 75C33 77 35 78 37 78C39 78 40 76 40 74C40 72 39 70 39 68C39 66 40 64 41 62"
                                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                                <path d="M41 62C43 59 46 57 49 56C52 55 55 55 58 56C61 57 63 59 64 62C65 64 65 67 65 69C65 72 64 74 64 77C64 79 65 80 67 80C69 80 70 78 70 76C70 74 69 72 69 70"
                                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                                <path d="M69 70C69 67 70 64 72 62C74 60 76 59 78 58C79 57 80 56 80 54C80 52 79 50 77 49C75 48 73 48 72 49"
                                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                                <!-- Eye -->
                                <circle cx="62" cy="24" r="2" fill="currentColor" opacity="0.9"/>
                                <!-- Mane detail -->
                                <path d="M58 22C56 19 55 16 56 14C57 12 60 12 62 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                                <path d="M52 27C50 24 49 21 50 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
                            </svg>
                        </div>

                        <!-- Corner accents -->
                        <div class="absolute -top-1 -left-1 w-4 h-4 border-t border-l border-neon-cyan/50"></div>
                        <div class="absolute -top-1 -right-1 w-4 h-4 border-t border-r border-neon-cyan/50"></div>
                        <div class="absolute -bottom-1 -left-1 w-4 h-4 border-b border-l border-neon-cyan/50"></div>
                        <div class="absolute -bottom-1 -right-1 w-4 h-4 border-b border-r border-neon-cyan/50"></div>
                    </div>
                </div>

                <!-- Brand name -->
                <div class="animate-fadeInUp" style="animation-delay: 0.8s; opacity: 0;">
                    <p class="text-sm md:text-base tracking-[8px] md:tracking-[12px] uppercase text-neon-cyan/50 mb-6 font-light">AnatoliaBox</p>
                </div>

                <!-- Ana başlık: Glitch efektli -->
                <div class="animate-fadeInUp" style="animation-delay: 1s; opacity: 0;">
                    <div class="glitch-wrapper text-center mb-4">
                        <h1 class="text-5xl md:text-7xl lg:text-8xl font-extrabold tracking-tight neon-text leading-none">
                            Çok Yakında
                        </h1>
                        <span class="glitch-copy text-5xl md:text-7xl lg:text-8xl font-extrabold tracking-tight leading-none" aria-hidden="true">Çok Yakında</span>
                        <span class="glitch-copy text-5xl md:text-7xl lg:text-8xl font-extrabold tracking-tight leading-none" aria-hidden="true">Çok Yakında</span>
                    </div>
                </div>

                <!-- Divider -->
                <div class="animate-fadeInUp" style="animation-delay: 1.2s; opacity: 0;">
                    <div class="flex items-center gap-4 my-8">
                        <div class="w-16 h-[1px] bg-gradient-to-r from-transparent to-neon-magenta/60"></div>
                        <div class="w-2 h-2 rotate-45 border border-neon-magenta/60"></div>
                        <div class="w-16 h-[1px] bg-gradient-to-l from-transparent to-neon-magenta/60"></div>
                    </div>
                </div>

                <!-- Alt metin -->
                <div class="animate-fadeInUp" style="animation-delay: 1.4s; opacity: 0;">
                    <p class="text-lg md:text-xl font-light text-white/40 tracking-[5px] uppercase mb-12">
                        Yeni Bir Deneyim Başlıyor
                    </p>
                </div>

                <!-- Alt neon çizgi -->
                <div class="animate-fadeInUp" style="animation-delay: 1.6s; opacity: 0;">
                    <div class="w-32 h-[1px] bg-gradient-to-r from-transparent via-neon-purple to-transparent mb-10"></div>
                </div>

                <!-- Footer info -->
                <div class="animate-fadeInUp" style="animation-delay: 1.8s; opacity: 0;">
                    <p class="text-[11px] tracking-[3px] text-white/15 uppercase">&copy; 2026 AnatoliaBox. Tüm Hakları Saklıdır.</p>
                </div>

            </main>

            <!-- ═══════ SAĞ SÜTUN: Banner Reklam Alanı ═══════ -->
            <aside class="hidden lg:flex flex-col items-center justify-center p-4">
                <div class="ad-slot w-full rounded-2xl flex flex-col items-center justify-center text-center p-4 sticky top-8">
                    <div class="space-y-3 opacity-30">
                        <svg class="w-8 h-8 mx-auto text-neon-purple/40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <p class="text-[10px] tracking-[3px] uppercase text-neon-purple/30">Reklam Alanı</p>
                    </div>
                </div>
            </aside>

        </div>
    </div>

    <!-- ═══════════ PARTİKÜL ANİMASYONU ═══════════ -->
    <script>
        // Floating particles
        (function() {
            const container = document.body;
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.cssText = `
                    position: fixed;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    width: ${Math.random() * 3 + 1}px;
                    height: ${Math.random() * 3 + 1}px;
                    background: ${Math.random() > 0.5 ? 'rgba(0,243,255,0.4)' : 'rgba(188,0,255,0.4)'};
                    border-radius: 50%;
                    pointer-events: none;
                    z-index: 5;
                    animation: float ${Math.random() * 10 + 8}s ease-in-out ${Math.random() * 5}s infinite;
                    opacity: ${Math.random() * 0.5 + 0.2};
                `;
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
