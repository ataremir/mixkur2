<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnatoliaBox | IP Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #0ea5e9;
            --table-border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: var(--accent);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--table-border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 16px;
            border-bottom: 1px solid var(--table-border);
        }
        th {
            background-color: #1a2333;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }
        tr:hover {
            background-color: #243147;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: #334155;
            color: #cbd5e1;
        }
        .ip {
            font-family: monospace;
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Ziyaretçi IP İzleme Paneli</h1>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Tarih / Saat</th>
                        <th>IP Adresi</th>
                        <th>Subdomain (Host)</th>
                        <th>Gidilen Yol</th>
                        <th>Tarayıcı (Agent)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td>{{ log.timestamp|date:"d.m.Y H:i:s" }}</td>
                        <td><span class="ip">{{ log.ip_address }}</span></td>
                        <td><span class="badge">{{ log.host }}</span></td>
                        <td><code>{{ log.path }}</code></td>
                        <td style="font-size: 11px; color: #94a3b8;">{{ log.user_agent|truncatechars:50 }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px;">Henüz kayıt bulunamadı.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
