<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşletme Girişi | AnatoliaBox</title>
    <meta name="google-adsense-account" content="ca-pub-9804139900544479">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { outfit: ['Outfit', 'sans-serif'] },
                    colors: {
                        neon: { cyan: '#00f3ff', magenta: '#ff00ea', purple: '#bc00ff' },
                        dark: { 900: '#050508', 800: '#0a0a12', 700: '#10101c', 600: '#1a1a2e' },
                    },
                },
            },
        }
    </script>
</head>
<body class="font-outfit bg-dark-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Background effects -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-1/3 left-1/4 w-[400px] h-[400px] bg-neon-cyan/8 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/3 right-1/4 w-[350px] h-[350px] bg-neon-purple/8 rounded-full blur-[100px]"></div>
    </div>

    <div class="relative z-10 w-full max-w-md mx-auto px-6">
        <!-- Logo -->
        <div class="text-center mb-10">
            <p class="text-xs tracking-[8px] uppercase text-neon-cyan/50 mb-2">AnatoliaBox</p>
            <h1 class="text-3xl font-bold text-white">İşletme Girişi</h1>
            <div class="w-16 h-[1px] bg-gradient-to-r from-transparent via-neon-cyan to-transparent mx-auto mt-4"></div>
        </div>

        <!-- Hata mesajları -->
        {% if messages %}
        {% for message in messages %}
        <div class="mb-6 px-4 py-3 rounded-lg border text-sm
            {% if message.tags == 'error' %}
                border-red-500/30 bg-red-500/10 text-red-300
            {% elif message.tags == 'success' %}
                border-green-500/30 bg-green-500/10 text-green-300
            {% else %}
                border-neon-cyan/30 bg-neon-cyan/10 text-neon-cyan
            {% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="id_username" class="block text-sm font-medium text-white/60 mb-2">Kullanıcı Adı</label>
                <input type="text" id="id_username" name="username" required
                       class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300 backdrop-blur-md"
                       placeholder="Kullanıcı adınızı girin" autocomplete="username">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-medium text-white/60 mb-2">Şifre</label>
                <input type="password" id="id_password" name="password" required
                       class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300 backdrop-blur-md"
                       placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit"
                    class="w-full py-3 px-6 bg-gradient-to-r from-neon-cyan/20 to-neon-purple/20 border border-neon-cyan/40 rounded-lg text-white font-semibold tracking-wide hover:from-neon-cyan/30 hover:to-neon-purple/30 hover:border-neon-cyan/60 hover:shadow-[0_0_30px_rgba(0,243,255,0.2)] transition-all duration-500 backdrop-blur-md">
                Giriş Yap
            </button>
        </form>

        <!-- Kayıt linki -->
        <div class="text-center mt-8">
            <p class="text-sm text-white/40">
                Henüz hesabınız yok mu?
                <a href="/kayit/" class="text-neon-cyan hover:text-neon-cyan/80 transition-colors duration-300 underline underline-offset-4">Kayıt Ol</a>
            </p>
        </div>

        <!-- Ana sayfa linki -->
        <div class="text-center mt-4">
            <a href="http://anatoliabox.store" class="text-xs text-white/20 hover:text-white/40 tracking-[3px] uppercase transition-colors duration-300">← Ana Sayfa</a>
        </div>
    </div>

</body>
</html>
