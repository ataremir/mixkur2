<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Düzenle | AnatoliaBox İşletme</title>
    <meta name="google-adsense-account" content="ca-pub-9804139900544479">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { outfit: ['Outfit', 'sans-serif'] },
                    colors: {
                        neon: { cyan: '#00f3ff', magenta: '#ff00ea', purple: '#bc00ff' },
                        dark: { 900: '#050508', 800: '#0a0a12', 700: '#10101c', 600: '#1a1a2e' },
                    },
                },
            },
        }
    </script>
</head>
<body class="font-outfit bg-dark-900 text-white min-h-screen">

    <!-- Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 right-0 w-[400px] h-[400px] bg-neon-cyan/5 rounded-full blur-[150px]"></div>
        <div class="absolute bottom-0 left-0 w-[350px] h-[350px] bg-neon-purple/5 rounded-full blur-[120px]"></div>
    </div>

    <!-- Navbar -->
    <nav class="relative z-20 border-b border-white/5 bg-dark-900/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="/dashboard/" class="text-sm tracking-[6px] uppercase text-neon-cyan/60 font-semibold hover:text-neon-cyan transition-colors">AnatoliaBox</a>
                <span class="text-white/10">|</span>
                <p class="text-xs tracking-[3px] uppercase text-white/30">Profil Düzenle</p>
            </div>
            <a href="/dashboard/" class="text-xs text-white/40 hover:text-white/60 transition-colors tracking-wide uppercase">← Dashboard</a>
        </div>
    </nav>

    <main class="relative z-10 max-w-2xl mx-auto px-6 py-10">

        <!-- Mesajlar -->
        {% if messages %}
        {% for message in messages %}
        <div class="mb-6 px-4 py-3 rounded-lg border text-sm
            {% if message.tags == 'error' %}border-red-500/30 bg-red-500/10 text-red-300
            {% else %}border-green-500/30 bg-green-500/10 text-green-300{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <h1 class="text-2xl font-bold mb-8">Profil Bilgilerini Düzenle</h1>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="id_isletme_adi" class="block text-sm font-medium text-white/60 mb-1.5">İşletme Adı</label>
                    <input type="text" id="id_isletme_adi" name="isletme_adi" value="{{ profil.isletme_adi }}"
                           class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300">
                </div>
                <div>
                    <label for="id_telefon" class="block text-sm font-medium text-white/60 mb-1.5">Telefon</label>
                    <input type="text" id="id_telefon" name="telefon" value="{{ profil.telefon }}"
                           class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300">
                </div>
            </div>

            <div>
                <label for="id_sektor" class="block text-sm font-medium text-white/60 mb-1.5">Sektör</label>
                <select id="id_sektor" name="sektor"
                        class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300">
                    {% for value, label in sektor_secenekleri %}
                    <option value="{{ value }}" {% if profil.sektor == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="id_adres" class="block text-sm font-medium text-white/60 mb-1.5">Açık Adres</label>
                <textarea id="id_adres" name="adres" rows="3"
                          class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300">{{ profil.adres }}</textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="id_il" class="block text-sm font-medium text-white/60 mb-1.5">İl</label>
                    <input type="text" id="id_il" name="il" value="{{ profil.il }}"
                           class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300">
                </div>
                <div>
                    <label for="id_ilce" class="block text-sm font-medium text-white/60 mb-1.5">İlçe</label>
                    <input type="text" id="id_ilce" name="ilce" value="{{ profil.ilce }}"
                           class="w-full px-4 py-3 bg-dark-700/50 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all duration-300">
                </div>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit"
                        class="flex-1 py-3 px-6 bg-gradient-to-r from-neon-cyan/20 to-neon-purple/20 border border-neon-cyan/40 rounded-lg text-white font-semibold tracking-wide hover:from-neon-cyan/30 hover:to-neon-purple/30 hover:border-neon-cyan/60 hover:shadow-[0_0_30px_rgba(0,243,255,0.2)] transition-all duration-500">
                    Kaydet
                </button>
                <a href="/dashboard/"
                   class="py-3 px-6 border border-white/10 rounded-lg text-white/40 hover:text-white/60 hover:border-white/20 transition-all duration-300 text-center">
                    İptal
                </a>
            </div>
        </form>
    </main>

</body>
</html>
