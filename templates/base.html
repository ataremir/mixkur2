<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AnatoliaBox Dashboard{% endblock %}</title>
    <meta name="description" content="AnatoliaBox Panel">
    <!-- Tailwind CSS (CDN for Stitch Aesthetic) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#0f172a', /* slate-900 */
                        'brand-card': '#1e293b', /* slate-800 */
                        'brand-accent': '#3b82f6', /* blue-500 */
                        'brand-text': '#f8fafc', /* slate-50 */
                        'brand-muted': '#94a3b8', /* slate-400 */
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-brand-dark text-brand-text antialiased min-h-screen flex flex-col">

    <!-- Top Navbar -->
    {% include 'shared/navbar.html' %}

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar Menu Elements -->
        <aside class="w-64 bg-brand-card border-r border-slate-700 hidden md:flex flex-col">
            {% block sidebar %}
                <!-- Default boş, özel sayfalar ezecek -->
            {% endblock %}
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-6 md:p-10">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
